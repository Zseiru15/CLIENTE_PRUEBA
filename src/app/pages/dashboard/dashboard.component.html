<mat-toolbar color="primary" class="toolbar">
    <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
    </button>
    <img src="/favicon.ico" alt="Logo Angular" class="logo">
    <span class="app-name">Mi Aplicacion</span>
    <span class="spacer"></span>
    <span class="usuario">{{usuario}}</span>

</mat-toolbar>
<mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="over" [(opened)]="showSidenav" class="sidenav">
        <mat-nav-list>
            <a mat-list-item routerLink="/dashboard/usuario" (click)="toggleSidenav()">Usuarios</a>
            <a mat-list-item routerLink="/dashboard/card" (click)="toggleSidenav()">card</a>
            <a mat-list-item routerLink="/dashboard/register" (click)="toggleSidenav()">Registro</a>
            <a mat-list-item routerLink="/dashboard/login" (click)="toggleSidenav()">Login</a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>

<mat-toolbar color="primary" class="informatbar">
    <span class="app-name">
        Barra de informacion actual 1 <br>
        Barra de informacion 2 <br>
        Barra de informacion 3 <br>
    </span>
    <span class="spacer"></span>
    <span class="app-name">
        Informacion de la pagina actual <br>
        Informacion de la pagina 2 <br>
        Informacion de la pagina 3 <br>
    </span>
    <span class="spacer"></span>
    <span class="usuario">
        {{usuario}} <br>
        {{usuario2}} <br>
        {{usuario3}} <br>
    </span>

</mat-toolbar>
